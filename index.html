<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的第一个网页</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 80px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }
    h1 { color: #0a7c5a; }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1>我的第一个网页</h1>
  <div class="card">
    <p>这个页面会通过 Git 上传到 GitHub，然后由 GitHub Pages 发布到公网。</p>
    <p>创建时间：<span id="now"></span></p>
  </div>

  <script>
    document.getElementById('now').textContent = new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
